version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pucmm_band_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pucmm_band
      POSTGRES_PASSWORD: pucmm_band_2024
      POSTGRES_DB: pucmm_band
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pucmm_band -d pucmm_band"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
